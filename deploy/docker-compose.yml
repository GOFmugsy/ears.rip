version: "3"

services:
  traefik:
    image: "traefik:v2.10"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  atl-ears-rip:
    build:
      dockerfile: Dockerfile.nginx
    container_name: "atl-ears-rip"
    ports:
      - 8001:80
      - 8444:443
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atl-ears-rip.rule=Host(`atl.ears.rip.local`,`atl.ears.rip`, `ears.rip`, `localhost`)" # Fix this for multiple cities
      - "traefik.http.routers.atl-ears-rip.entrypoints=web"

