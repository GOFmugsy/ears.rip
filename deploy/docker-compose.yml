version: "3"

services:
  traefik:
    image: "traefik:v2.10"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  nginx-exporter:
    image: "nginx/nginx-prometheus-exporter:latest"
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri
      - http://atl-ears-rip/metrics

  prometheus:
    build:
      dockerfile: Dockerfile.prometheus
    container_name: "ears-rip-prometheus"
    ports:
      - "9090:9090"

  grafana:
    image: "grafana/grafana-oss:latest"
    container_name: "grafana"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-atl-ears-rip.rule=Host(`grafana.atl.ears.rip.local`, `grafana.atl.ears.rip`, `grafana.ears.rip`)"
      - "traefik.http.routers.grafana-atl-ears-rip.entrypoints=web"

  atl-ears-rip:
    build:
      dockerfile: Dockerfile.nginx
    container_name: "atl-ears-rip"
    ports:
      - "8001:80"
      - "8444:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atl-ears-rip.rule=Host(`atl.ears.rip.local`,`atl.ears.rip`, `ears.rip`, `localhost`)" # Fix this for multiple cities
      - "traefik.http.routers.atl-ears-rip.entrypoints=web"

volumes:
  grafana-data:
    external: true
