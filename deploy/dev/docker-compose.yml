version: "3"

services:
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  nginx-exporter:
    image: "nginx/nginx-prometheus-exporter:latest"
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri
      - http://atl-ears-rip/metrics

  nginx-exporter-avl:
    image: "nginx/nginx-prometheus-exporter:latest"
    command:
      - -nginx.scrape-uri
      - http://avl-ears-rip/metrics

  nginx-exporter-landing:
    image: "nginx/nginx-prometheus-exporter:latest"
    command:
      - -nginx.scrape-uri
      - http://ears-rip/metrics

  prometheus:
    build:
      dockerfile: Dockerfile.prometheus
    container_name: "ears-rip-prometheus"
    ports:
      - "9090:9090"

  grafana:
    image: "grafana/grafana-oss:latest"
    container_name: "grafana"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-atl-ears-rip.rule=Host(`grafana.atl.ears.rip.local`) || Host(`grafana.atl.ears.rip`) || Host(`grafana.ears.rip`)"
      - "traefik.http.routers.grafana-atl-ears-rip.entrypoints=web"

  atl-ears-rip:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.nginx
      args:
        CITY: atl
        COMMIT: ${COMMIT:-unknown}
    container_name: "atl-ears-rip"
    ports:
      - "8001:80"
      - "8444:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atl-ears-rip.rule=Host(`atl.ears.rip.local`) || Host(`atl.ears.rip`)"
      - "traefik.http.routers.atl-ears-rip.entrypoints=web"

  avl-ears-rip:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.nginx
      args:
        CITY: avl
        COMMIT: ${COMMIT:-unknown}
    container_name: "avl-ears-rip"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avl-ears-rip.rule=Host(`avl.ears.rip.local`) || Host(`avl.ears.rip`)"
      - "traefik.http.routers.avl-ears-rip.entrypoints=web"

  # the ears.rip landing page, listing every city
  ears-rip:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.nginx
      args:
        CITY: landing
        BASE_URL: "/"
        COMMIT: ${COMMIT:-unknown}
    container_name: "ears-rip"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ears-rip.rule=Host(`ears.rip.local`) || Host(`ears.rip`) || Host(`localhost`)"
      - "traefik.http.routers.ears-rip.entrypoints=web"

volumes:
  grafana-data:
    external: true
