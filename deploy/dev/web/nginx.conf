# user       www www;  ## Default: nobody
# worker_processes  5;  ## Default: 1
# error_log  logs/error.log;
# pid        logs/nginx.pid;
# worker_rlimit_nofile 8192;

events {
  # worker_connections  4096;  ## Default: 1024
}

http {
	include       /etc/nginx/mime.types;
	server { 
		root /usr/share/nginx/html;
		location / {
		}
		location /metrics {
			stub_status on;
		}
		location /events-ics {
			types {
       	text/calendar    ics;
      }
		}
	}
}
