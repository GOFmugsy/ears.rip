# Settings shared by every city. Each city's own settings (title, url, timezone, and which
# data/<city>/ folder to build from) are in config/<city>/hugo.toml, selected with
# --environment <city>, e.g. hugo server --environment atl
theme = "risotto"
locale = "en-US"
copyright = "There is absolutely no guarantee of any kind provided with this page or any derivative of this page"
disableKinds = ["rss"]
# Every show is in the future; without this hugo skips them all
buildFuture = true

[params]
# Set from the environment at build time (HUGO_PARAMS_COMMIT)
commit = "unknown"

[params.theme]
palette = "base16-dark"

[params.about]
logo = "🎧"

[taxonomies]
venue = "venues"
date = "dates"

[outputs]
home = ["html", "calendar"]
term = ["html", "calendar"]

[menu]
  [[menu.main]]
    name = "shows"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "venues"
    url = "/venues/"
    weight = 20
  [[menu.main]]
    name = "dates"
    url = "/dates/"
    weight = 30
  [[menu.main]]
    name = "about"
    url = "/about/"
    weight = 40
